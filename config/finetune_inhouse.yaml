path : data/graph_inhouse_example
result : results
index_folder : data/fold_inhouse_example
num_cls : 3
views: sag,cor,axi

# Training Settings
num_workers : 2
bs : 2
num_epoch : 20

# Optimizer settings
lr : 3.0e-5
weight_decay : 1.0e-4

# Model Settings
task : finetune_inhouse
input_size : 64
net : KGNet

# Rich Label Settings (default = original behaviour)
label_mode : single       # options: single | ordinal | soft | multi_label
ordinal_alpha : 0.0       # smoothing for soft mode (0 = no smoothing)
num_labels : 1            # used only when label_mode = multi_label
cls_weights : null        # null = uniform; or [w0, w1, w2] for weighted CE
freeze_encoder : false
